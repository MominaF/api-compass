[project]
name = "api-compass-backend"
version = "0.1.0"
description = "API COMPASS backend (FastAPI)"
authors = [
    { name = "momina", email = "momina.f99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography<49 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "cryptography>=50 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "fastapi>=0.162.0",
    "jsonschema-rs>=0.60.3",
    "openapi-spec-validator>=0.9.0",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
